[package]
name = "request-slip"
version = "0.1.0"
edition = "2024"
publish = false
description = "Static, bounded Hurl request export through the official parser"

[dependencies]
hurl_core = "=8.0.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"

[profile.release]
strip = true

